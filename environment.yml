name: binder-env
channels:
  - conda-forge
dependencies:
  # Python 3.8-compatible stack
  - python=3.8
  - numpy=1.24.4
  - scipy=1.10.1
  - xarray=2023.06.0
  - matplotlib=3.7.3
  - cartopy=0.22.0
  - pyproj=3.5.0
  - shapely=2.0.4
  - netcdf4=1.6.5
  - cftime=1.6.4
  - ipython=8.12.2
  - f90nml=1.4.4

  # Fortran toolchain and libraries
  - fortran-compiler
  - make
  - pkg-config
  - netcdf-fortran
  - eccodes=2.35.0

variables:
  CARTOPY_DATA_DIR: /home/jovyan/cartopy_data
